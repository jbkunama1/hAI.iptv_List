name: App Integrations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Coderabbit
        uses: coderabbit/action@v1
        continue-on-error: true

      - name: testdrive.ai
        uses: testdriveai/action@v1
        continue-on-error: true

      - name: Depfu
        uses: depfu/action@v1
        continue-on-error: true

      - name: Ranger
        uses: ranger/action@v1
        continue-on-error: true

      - name: GitBook
        uses: gitbook/action@v1
        continue-on-error: true
